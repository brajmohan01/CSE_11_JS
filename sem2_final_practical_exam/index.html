<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <h1>Countdown Timer</h1>
        <input id="startValue" type="number" min="1" placeholder="Enter a number">
        <button id="startBtn">Start</button>
        <div id="display" class="display">Enter a number and press Start</div>
    </div>
    <script src="script.js"></script>
</body>

</html>
